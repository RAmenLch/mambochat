# frontend/mambo/nginx.conf

server {
    # 监听容器的 80 端口
    listen 80;

    # 设置网站根目录，指向我们从 builder 阶段复制过来的文件
    root /usr/share/nginx/html;
    index index.html;

    # 规则 1: 处理前端路由 (SPA)
    # 对于所有非文件、非目录的请求，都返回 index.html
    # 这是为了让 Vue Router 能够接管路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 规则 2: 反向代理 API 请求
    # 将所有以 /api/ 开头的请求转发给后端服务
    location /api/ {
        # proxy_pass 指向后端服务的地址
        # "backend" 是 docker-compose.yml 中定义的服务名
        # Docker 的内部 DNS 会将其解析到后端容器的 IP
        proxy_pass http://backend:8000;

        # 设置一些代理头，以便后端能获取真实的请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 可以添加其他配置，例如 gzip 压缩以优化性能
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
