# frontend/mambo/nginx.conf

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;

        # --- 以下是解决流式传输问题的关键配置 ---

        # 1. 关闭代理缓冲
        # 这是最核心的指令，告诉 Nginx 不要缓冲来自后端服务的响应
        proxy_buffering off;

        # 2. (可选但推荐) 关闭缓存
        # 确保不会缓存API的动态响应
        proxy_cache off;

        # 3. 实时传递 Header
        # 确保 Content-Type: text/event-stream 等头信息能立即发送给客户端
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_encoding off;

        # 4. 设置代理头，以便后端能获取真实的请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 5. X-Accel-Buffering
        # 这是一个专门的头信息，用来显式地告诉 Nginx 不要缓冲响应。
        # 与 proxy_buffering off; 配合使用，效果更佳。
        proxy_set_header X-Accel-Buffering no;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
