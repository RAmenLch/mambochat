[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.dynamic]
# 版本号从 _version.txt 文件读取（路径相对 pyproject.toml），构建时无需 import 任何模块，
# 避免 uv editable 构建（PEP 660）cwd 不在源码目录时找不到 backend 包
version = { file = ["_version.txt"] }

[project]
name = "mambo-chat-backend"
dynamic = ["version"]
description = "The backend service for the LLM-API Client project."
requires-python = ">=3.11"

dependencies = [
    # Web
    "fastapi==0.119.0",
    "uvicorn==0.37.0",
    "python-multipart==0.0.9",

    # Database
    "SQLAlchemy==2.0.44",
    "aiosqlite==0.21.0",
    "sqlite-vec>=0.1.6,<0.1.10",
    "alembic>=1.18.4",

    # HTTP
    "httpx==0.28.1",

    # LLM / AI
    "openai>=2.45,<3",
    "langchain>=1.5.2,<1.6",
    "langchain-core>=1.8.4,<1.9",
    "langchain-openai>=1.8.5,<2",
    "langchain-anthropic>=1.7.12,<2",
    # anthropic 1.0+ 改用 httpx2 客户端，与 langchain-anthropic 的 httpx 客户端注入尚未验证，
    # 暂锁定在 0.x（0.120+ 满足 langchain-anthropic 要求）。
    "anthropic>=0.120,<1",
    "langchain-google-genai>=4.5.2,<5",
    "langchain-mcp-adapters>=0.3.2,<1",
    "langgraph>=1.2.24,<1.3",
    "langgraph-prebuilt>=1.1.3,<1.2",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    # DEPRECATED: deepagents 为 DeepAgent 专用依赖，DeepAgent 已淘汰，不再维护，
    # 保留仅用于兼容存量数据；后续移除 DeepAgent 时一并删除。
    # 0.6+ 要求 wcmatch>=11，与 mambo-agents 的 wcmatch<10 冲突，故锁定 0.5.x。
    "deepagents>=0.5.6,<0.6",
    "mcp>=1.2,<1.25",

    # Document processing
    "langchain-pymupdf4llm>=0.0.18",
    "python-docx>=1.1.0",
    "jieba==0.42.1",
    "trafilatura>=1.12.0",
    "html2text>=2025.4.15",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",

    # Remote execution
    # mambo-agents 声明 paramiko<5，这里显式对齐，避免解析到 5.x 后再被降级
    "paramiko>=4.0.0,<5",

    # Config / Scheduler / IO
    "PyYAML>=6.0.3",
    "python-dotenv>=1.0.0",
    "apscheduler==3.11.1",
    "aiofiles==23.2.1",
    "pytz",

    # Previously missing implicit deps (now explicit)
    "charset-normalizer",
    "wcmatch",

    # Production server
    "gunicorn==23.0.0",

    "mambo-agents==0.4.2b8",
]

[project.scripts]
mambo = "backend.mambo_cli.main:main"

[dependency-groups]
dev = [
]

[tool.uv]
# 版本锁定交给 uv.lock，无需在 dependencies 中锁定传递依赖

# 声明 PyPI 官方索引（供 sources 引用）
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

# mambo-agents 是预发布版本，国内镜像不会同步，
# 必须直接从 PyPI 官方源拉取
[tool.uv.sources]
mambo-agents = { index = "pypi" }
