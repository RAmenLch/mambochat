[project]
name = "mambo-chat-backend"
version = "1.2.0"
description = "The backend service for the LLM-API Client project."
requires-python = ">=3.11"
dependencies = [
    "aiofiles==23.2.1",
    "aiosqlite==0.21.0",
    "annotated-types==0.7.0",
    "anyio==4.11.0",
    "certifi==2025.10.5",
    "click==8.3.0",
    "colorama==0.4.6",
    "fastapi==0.119.0",
    "greenlet==3.2.4",
    "gunicorn==23.0.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "packaging==25.0",
    "pydantic==2.12.2",
    "pydantic_core==2.41.4",
    "python-multipart==0.0.9",
    "sniffio==1.3.1",
    "SQLAlchemy==2.0.44",
    "starlette==0.48.0",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "uvicorn==0.37.0",
    "apscheduler==3.11.1",
    "pytz",
    "mcp",
    "openai>=2.15.0",
    "langchain-mcp-adapters>=0.2.1",
    "langchain>=1.2.6",
    "langchain-openai>=1.1.7",
    "langchain-google-genai>=4.2.0",
    "sqlite-vec>=0.1.6",
    "jieba==0.42.1",
    "langchain-anthropic>=1.3.1",
    "alembic>=1.18.4",
    "PyYAML>=6.0.3",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph>=1.1.2",
    "langchain-core>=1.2.19",
    "deepagents>=0.4.12"
]

[tool.uv]
# 你可以在这里为 uv 添加一些配置，不过通常默认即可
# 例如，指定 pypi 源
# index-url = "https://pypi.org/simple"
[tool.setuptools.packages.find]
where = ["."]
