[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[project]
name = "mambo-chat-backend"
version = "1.2.5"
description = "The backend service for the LLM-API Client project."
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi==0.119.0",
    "uvicorn==0.37.0",
    "python-multipart==0.0.9",

    # Database
    "SQLAlchemy==2.0.44",
    "aiosqlite==0.21.0",
    "sqlite-vec>=0.1.6",
    "alembic>=1.18.4",

    # HTTP
    "httpx==0.28.1",

    # LLM / AI
    "openai>=2.15.0",
    "langchain>=1.2.6,<1.4",
    "langchain-core>=1.2.19,<1.5",
    "langchain-openai>=1.1.7,<2",
    "langchain-anthropic>=1.3.1,<2",
    "langchain-google-genai>=4.2.0,<5",
    "langchain-mcp-adapters>=0.2.1,<1",
    "langgraph>=1.1.2,<1.2",
    "langgraph-prebuilt>=1.0.8,<1.0.11",
    "langgraph-checkpoint-sqlite>=3.0.3,<4",
    "deepagents>=0.4.12",
    "mcp",

    # Document processing
    "langchain-pymupdf4llm>=0.0.18",
    "python-docx>=1.1.0",
    "jieba==0.42.1",

    # Remote execution
    "paramiko>=4.0.0",

    # Config / Scheduler / IO
    "PyYAML>=6.0.3",
    "apscheduler==3.11.1",
    "aiofiles==23.2.1",
    "pytz",

    # Previously missing implicit deps (now explicit)
    "charset-normalizer",
    "wcmatch",

    # Production server
    "gunicorn==23.0.0",

    "mambo-agents==0.2.0a33",
]

[dependency-groups]
dev = [
]

[tool.uv]
# 版本锁定交给 uv.lock，无需在 dependencies 中锁定传递依赖

# 声明 PyPI 官方索引（供 sources 引用）
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

# mambo-agents 是预发布版本，国内镜像不会同步，
# 必须直接从 PyPI 官方源拉取
[tool.uv.sources]
mambo-agents = { index = "pypi" }
